<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>더보기 메뉴 반응형 확인</title><style>body{margin:0;padding:24px;background:#f8f3e9;color:#4b382c;font:14px/1.7 system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}p{max-width:850px}label{display:inline-flex;align-items:center;gap:8px;margin:12px 16px 16px 0}select{font:inherit;padding:8px;border:1px solid #d9cbb3;border-radius:10px;background:#fffaf0;min-height:44px}.stage{overflow:auto;border:1px solid #ddd0b8;border-radius:16px;background:#ede4d4}iframe{display:block;border:0;height:780px;width:1024px}</style></head><body><h1>더보기 · 화면 폭과 숫자 배지 비교</h1><p>현재 앱의 더보기 구조와 실제 CSS를 사용하는 독립 확인 페이지입니다. 앱 스크립트와 저장 데이터는 연결하지 않습니다. 1024px에서 사이드바로 전환되지만 메뉴 치수는 유지됩니다.</p><label>화면 폭<select id="width"><option>320</option><option>390</option><option>768</option><option>1023</option><option selected>1024</option><option>1280</option><option>1440</option><option>1920</option></select>px</label><label>보관 배지<select id="count"><option>0</option><option>3</option><option selected>12</option><option>99</option></select></label><div class="stage"><iframe id="frame" title="더보기 메뉴 반응형 확인 화면"></iframe></div><p>가로 스크롤은 큰 화면을 작은 브라우저 안에서 확인하기 위한 미리보기 바깥 영역에만 허용합니다. 실제 앱 내부 넘침 여부는 브라우저에서 따로 확인해야 합니다.</p><script src="snapshot.js"></script><script>
function render(){const doc=new DOMParser().parseFromString(window.moreSnapshot,'text/html');doc.querySelectorAll('script').forEach(el=>el.remove());const base=doc.createElement('base');base.href=new URL('../../',location.href).href;doc.head.prepend(base);doc.querySelectorAll('.view').forEach(el=>el.hidden=el.id!=='view-more');doc.querySelectorAll('.nav-item').forEach(el=>{el.classList.toggle('active',el.dataset.view==='more');if(el.dataset.view==='more')el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});doc.getElementById('archive-count').textContent=document.getElementById('count').value;doc.querySelectorAll('button,a').forEach(el=>el.setAttribute('tabindex','-1'));const frame=document.getElementById('frame');frame.style.width=document.getElementById('width').value+'px';frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;}
for(const select of document.querySelectorAll('select'))select.addEventListener('change',render);render();
</script></body></html>
